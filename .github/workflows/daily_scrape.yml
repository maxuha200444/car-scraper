name: Daily Car Count

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <-- Решение для ошибки 128
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # <-- Обновлено с v4 на v5

      - name: Set up Python
        uses: actions/setup-python@v6  # <-- Обновлено с v5 на v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add car_count_history.csv
          git commit -m "Обновление данных за $(date +'%Y-%m-%d')" || echo "Нет изменений"
          git push
