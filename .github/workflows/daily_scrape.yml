- name: Commit and push results
  run: |
    git config --local user.email "action@github.com"
    git config --local user.name "GitHub Action"
    if [ -f car_count_history.csv ]; then
      git add car_count_history.csv
      git commit -m "Обновление данных за $(date +'%Y-%m-%d')" || echo "Нет изменений"
      git push
    else
      echo "Файл car_count_history.csv не найден, пропускаем коммит."
    fi
